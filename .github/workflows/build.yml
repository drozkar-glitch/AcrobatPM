name: Build Windows 11 (.EXE)
on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
permissions:
  contents: write
env:
  APP_NAME: "AcrobatPM"
  APP_VERSION: "1.0"
  PLATFORM_TARGET: "windows_exe"
  PYTHONIOENCODING: "utf-8"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  build-windows:
    name: Windows 11 Standalone (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: win-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            win-pip-
      - name: Install Dependencies & Compile Standalone .EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          RUN_NUM: ${{ github.run_number }}
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          if (Test-Path 'requirements.txt') { pip install -r requirements.txt }
          New-Item -ItemType Directory -Force -Path 'build_win' | Out-Null
          @'
          import os, sys, re, glob, json, shutil, subprocess, urllib.request, urllib.parse
          from PIL import Image, ImageDraw

          app_name = os.environ.get('APP_NAME', 'WinApp').strip()
          app_ver = os.environ.get('APP_VERSION', '1.0').strip()
          build_num = int(os.environ.get('RUN_NUM', '1') or '1') + 100
          os.makedirs('build_win', exist_ok=True)

          if os.path.isfile('icon_gen.py'):
              subprocess.run([sys.executable, 'icon_gen.py'], check=False)

          ico_path = 'assets/app.ico' if os.path.isfile('assets/app.ico') else 'build_win/app.ico'
          if not os.path.isfile(ico_path):
              sz = 256
              im = Image.new('RGBA', (sz, sz), (0, 0, 0, 0))
              dr = ImageDraw.Draw(im)
              dr.rounded_rectangle([18, 24, 238, 244], radius=52, fill=(0, 0, 0, 90))
              dr.rounded_rectangle([16, 14, 240, 238], radius=52, fill=(15, 23, 42, 255), outline=(56, 189, 248, 255), width=6)
              dr.rounded_rectangle([46, 40, 210, 206], radius=28, fill=(220, 38, 38, 255))
              dr.rounded_rectangle([54, 46, 202, 118], radius=22, fill=(248, 113, 113, 95))
              dr.rounded_rectangle([72, 84, 184, 102], radius=8, fill=(255, 255, 255, 245))
              dr.rounded_rectangle([72, 118, 184, 136], radius=8, fill=(255, 255, 255, 220))
              dr.rounded_rectangle([72, 152, 148, 170], radius=8, fill=(255, 255, 255, 195))
              im.save(ico_path, format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])

          nums = [int(x) for x in re.findall(r'\d+', app_ver)][:3]
          while len(nums) != 3: nums.append(0)
          vt = f'({nums[0]}, {nums[1]}, {nums[2]}, {build_num})'
          ver_txt = f'''VSVersionInfo(
            ffi=FixedFileInfo(filevers={vt}, prodvers={vt}, mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
            kids=[
              StringFileInfo([StringTable('040504B0', [
                StringStruct('CompanyName', 'Pavel Mareš'),
                StringStruct('FileDescription', '{app_name} pro Windows 11'),
                StringStruct('FileVersion', '{app_ver}.{build_num}'),
                StringStruct('InternalName', '{app_name}'),
                StringStruct('LegalCopyright', '© 2026 Created by Pavel Mareš'),
                StringStruct('OriginalFilename', '{app_name}.exe'),
                StringStruct('ProductName', '{app_name}'),
                StringStruct('ProductVersion', '{app_ver}')
              ])]),
              VarFileInfo([VarStruct('Translation', [1029, 1200])])
            ]
          )'''
          open('build_win/version_info.txt', 'w', encoding='utf-8').write(ver_txt)

          entry = next((p for p in ['main.py', 'src/main.py', 'app.py'] if os.path.isfile(p)), None)
          if not entry:
              py_files = [p for p in glob.glob('*.py') if p != 'icon_gen.py']
              entry = py_files[0] if py_files else None
          if not entry:
              print('CHYBA: Nebyl nalezen vstupni soubor main.py!'); sys.exit(1)

          cmd = [sys.executable, '-m', 'PyInstaller', '--noconfirm', '--clean', '--onefile', '--windowed',
                 '--name', app_name, '--icon', ico_path, '--version-file', 'build_win/version_info.txt']
          if os.path.isdir('assets'): cmd.extend(['--add-data', 'assets;assets'])
          if os.path.isdir('src'): cmd.extend(['--paths', 'src'])
          req_low = open('requirements.txt', 'r', encoding='utf-8', errors='ignore').read().lower() if os.path.isfile('requirements.txt') else ''
          for pkg_mod in [('pymupdf', 'pymupdf'), ('pymupdf', 'fitz'), ('pypdfium2', 'pypdfium2'), ('pytesseract', 'pytesseract')]:
              if pkg_mod[0] in req_low: cmd.extend(['--collect-all', pkg_mod[1]])
          cmd.append(entry)
          print('Spoustim PyInstaller:', ' '.join(cmd))
          subprocess.run(cmd, check=True)

          built_exe = os.path.join('dist', f'{app_name}.exe')
          final_name = f'{app_name}-{app_ver}.{build_num}.exe'
          final_exe = os.path.join('dist', final_name)
          shutil.move(built_exe, final_exe)
          print('Hotovo EXE:', final_exe, os.path.getsize(final_exe), 'B')

          gh_tok = os.environ.get('GH_TOKEN', '').strip()
          repo_full = os.environ.get('REPO_FULL', '').strip()
          if gh_tok and repo_full:
              def gh_api(url, method='GET', data=None, ctype='application/json'):
                  h = {'Authorization': f'Bearer {gh_tok}', 'Accept': 'application/vnd.github+json', 'User-Agent': 'Stavitel-Win-Builder'}
                  if data is not None: h['Content-Type'] = ctype
                  req = urllib.request.Request(url, data=data, headers=h, method=method)
                  with urllib.request.urlopen(req, timeout=300) as r:
                      raw = r.read()
                      return json.loads(raw.decode('utf-8')) if raw else {}
              tag = 'exe-latest'
              meta = json.dumps({'exe_name': final_name, 'version': f'{app_ver}.{build_num}'})
              rel = None
              try: rel = gh_api(f'https://api.github.com/repos/{repo_full}/releases/tags/{tag}')
              except Exception: rel = None
              if rel and rel.get('id'):
                  rid = rel['id']
                  for a in rel.get('assets', []):
                      gh_api(f'https://api.github.com/repos/{repo_full}/releases/assets/{a["id"]}', method='DELETE')
                  rel = gh_api(f'https://api.github.com/repos/{repo_full}/releases/{rid}', method='PATCH',
                               data=json.dumps({'name': f'Poslední Windows .EXE ({final_name})', 'body': meta, 'prerelease': True}).encode('utf-8'))
              else:
                  rel = gh_api(f'https://api.github.com/repos/{repo_full}/releases', method='POST',
                               data=json.dumps({'tag_name': tag, 'name': f'Poslední Windows .EXE ({final_name})', 'body': meta, 'prerelease': True}).encode('utf-8'))
              up_url = f'https://uploads.github.com/repos/{repo_full}/releases/{rel["id"]}/assets?name={urllib.parse.quote(final_name)}'
              with open(final_exe, 'rb') as ef:
                  up = gh_api(up_url, method='POST', data=ef.read(), ctype='application/vnd.microsoft.portable-executable')
              print('EXE publikovano v Release exe-latest:', up.get('browser_download_url', ''))
          '@ | Set-Content -Path 'build_win/_run_win_build.py' -Encoding UTF8
          python build_win/_run_win_build.py
      - name: Upload Windows .EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Windows-EXE
          path: dist/*.exe
