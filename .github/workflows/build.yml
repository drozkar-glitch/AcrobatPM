name: Build Windows 11 (Setup.exe Installer)
on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
permissions:
  contents: write
env:
  APP_NAME: "AcrobatPM"
  APP_VERSION: "1.0"
  PLATFORM_TARGET: "windows_exe"
  WIN_PACKAGE_TYPE: "installer"
  PYTHONIOENCODING: "utf-8"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  build-windows:
    name: Windows 11 (Inno Setup Installer)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: win-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            win-pip-
      - name: Build Application & Package Windows 11 Setup.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          RUN_NUM: ${{ github.run_number }}
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          if (Test-Path 'requirements.txt') { pip install -r requirements.txt }
          if ($env:WIN_PACKAGE_TYPE -ne 'portable') {
            $iscc = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe', 'C:\Program Files\Inno Setup 6\ISCC.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $iscc) {
              Write-Host 'Instaluji Inno Setup 6 pres Chocolatey...'
              choco install innosetup -y --no-progress
            }
          }
          New-Item -ItemType Directory -Force -Path 'build_win' | Out-Null
          New-Item -ItemType Directory -Force -Path 'out_exe' | Out-Null
          @'
          import os, sys, re, glob, json, uuid, shutil, subprocess, urllib.request, urllib.parse
          from PIL import Image, ImageDraw

          BS = chr(92)
          DQ = chr(34)
          app_name = os.environ.get('APP_NAME', 'WinApp').strip()
          app_ver = os.environ.get('APP_VERSION', '1.0').strip()
          pkg_type = os.environ.get('WIN_PACKAGE_TYPE', 'installer').strip().lower()
          is_installer = (pkg_type != 'portable')
          build_num = int(os.environ.get('RUN_NUM', '1') or '1') + 100
          os.makedirs('build_win', exist_ok=True)
          os.makedirs('out_exe', exist_ok=True)

          if os.path.isfile('icon_gen.py'):
              subprocess.run([sys.executable, 'icon_gen.py'], check=False)

          ico_path = 'assets/app.ico' if os.path.isfile('assets/app.ico') else 'build_win/app.ico'
          if not os.path.isfile(ico_path):
              sz = 256
              im = Image.new('RGBA', (sz, sz), (0, 0, 0, 0))
              dr = ImageDraw.Draw(im)
              dr.rounded_rectangle([18, 24, 238, 244], radius=52, fill=(0, 0, 0, 90))
              dr.rounded_rectangle([16, 14, 240, 238], radius=52, fill=(15, 23, 42, 255), outline=(56, 189, 248, 255), width=6)
              dr.rounded_rectangle([46, 40, 210, 206], radius=28, fill=(220, 38, 38, 255))
              dr.rounded_rectangle([54, 46, 202, 118], radius=22, fill=(248, 113, 113, 95))
              dr.rounded_rectangle([72, 84, 184, 102], radius=8, fill=(255, 255, 255, 245))
              dr.rounded_rectangle([72, 118, 184, 136], radius=8, fill=(255, 255, 255, 220))
              dr.rounded_rectangle([72, 152, 148, 170], radius=8, fill=(255, 255, 255, 195))
              im.save(ico_path, format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          abs_ico = os.path.abspath(ico_path)

          nums = [int(x) for x in re.findall(r'\d+', app_ver)][:3]
          while len(nums) != 3: nums.append(0)
          vt = f'({nums[0]}, {nums[1]}, {nums[2]}, {build_num})'
          ver_txt = (
              'VSVersionInfo(\n'
              f'  ffi=FixedFileInfo(filevers={vt}, prodvers={vt}, mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),\n'
              '  kids=[\n'
              '    StringFileInfo([StringTable("040504B0", [\n'
              '      StringStruct("CompanyName", "Pavel Mareš"),\n'
              f'      StringStruct("FileDescription", "{app_name} pro Windows 11"),\n'
              f'      StringStruct("FileVersion", "{app_ver}.{build_num}"),\n'
              f'      StringStruct("InternalName", "{app_name}"),\n'
              '      StringStruct("LegalCopyright", "© 2026 Created by Pavel Mareš"),\n'
              f'      StringStruct("OriginalFilename", "{app_name}.exe"),\n'
              f'      StringStruct("ProductName", "{app_name}"),\n'
              f'      StringStruct("ProductVersion", "{app_ver}")\n'
              '    ])]),\n'
              '    VarFileInfo([VarStruct("Translation", [1029, 1200])])\n'
              '  ]\n'
              ')\n'
          )
          open('build_win/version_info.txt', 'w', encoding='utf-8').write(ver_txt)

          entry = next((p for p in ['main.py', 'src/main.py', 'app.py'] if os.path.isfile(p)), None)
          if not entry:
              py_files = [p for p in glob.glob('*.py') if p != 'icon_gen.py']
              entry = py_files[0] if py_files else None
          if not entry:
              print('CHYBA: Nebyl nalezen vstupni soubor main.py!'); sys.exit(1)

          req_txt = open('requirements.txt', 'r', encoding='utf-8', errors='ignore').read() if os.path.isfile('requirements.txt') else ''
          main_txt = open(entry, 'r', encoding='utf-8', errors='ignore').read()
          req_low = req_txt.lower()

          cmd = [sys.executable, '-m', 'PyInstaller', '--noconfirm', '--clean',
                 ('--onedir' if is_installer else '--onefile'), '--windowed',
                 '--name', app_name, '--icon', abs_ico, '--version-file', os.path.abspath('build_win/version_info.txt')]
          if os.path.isdir('assets'): cmd.extend(['--add-data', 'assets;assets'])
          if os.path.isdir('src'): cmd.extend(['--paths', 'src'])
          for pkg_mod in [('pymupdf', 'pymupdf'), ('pymupdf', 'fitz'), ('pypdfium2', 'pypdfium2'), ('pytesseract', 'pytesseract')]:
              if pkg_mod[0] in req_low: cmd.extend(['--collect-all', pkg_mod[1]])
          cmd.append(entry)
          print('Spoustim PyInstaller:', ' '.join(cmd))
          subprocess.run(cmd, check=True)

          if is_installer:
              cands = [
                  r'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
                  r'C:\Program Files\Inno Setup 6\ISCC.exe',
                  shutil.which('ISCC'),
                  shutil.which('iscc')
              ]
              iscc_bin = next((c for c in cands if c and os.path.isfile(c)), None)
              if not iscc_bin:
                  subprocess.run(['winget', 'install', '--id', 'JRSoftware.InnoSetup', '-e', '--silent', '--accept-package-agreements', '--accept-source-agreements'], check=False)
                  iscc_bin = next((c for c in cands[:2] if os.path.isfile(c)), None)
              if not iscc_bin:
                  print('CHYBA: Kompilator Inno Setup (ISCC.exe) nebyl nalezen!'); sys.exit(1)

              help_res = subprocess.run([iscc_bin, '/?'], capture_output=True, text=True)
              arch_id = 'x64compatible' if 'x64compatible' in (help_res.stdout + help_res.stderr) else 'x64'
              cz_isl = os.path.join(os.path.dirname(iscc_bin), 'Languages', 'Czech.isl')
              lang_line = ('Name: ' + DQ + 'czech' + DQ + '; MessagesFile: ' + DQ + 'compiler:Languages' + BS + 'Czech.isl' + DQ) if os.path.isfile(cz_isl) else ('Name: ' + DQ + 'default' + DQ + '; MessagesFile: ' + DQ + 'compiler:Default.isl' + DQ)

              ext_match = re.search(r'STAVITEL_WIN_EXT:\s*(\.[A-Za-z0-9]+)', req_txt + '\n' + main_txt)
              assoc_ext = ext_match.group(1).lower() if ext_match else ('.pdf' if ('pymupdf' in req_low or 'pdf' in app_name.lower() or 'acrobat' in app_name.lower()) else '')
              app_guid = str(uuid.uuid5(uuid.NAMESPACE_DNS, 'cz.mares.win.' + app_name.lower())).upper()
              setup_base = f'{app_name}-Setup-{app_ver}.{build_num}'
              abs_onedir = os.path.abspath(os.path.join('dist', app_name))
              abs_out_dir = os.path.abspath('out_exe')

              iss = [
                  '[Setup]',
                  'AppId={{' + app_guid + '}',
                  'AppName=' + app_name,
                  f'AppVersion={app_ver}.{build_num}',
                  f'AppVerName={app_name} {app_ver}',
                  'AppPublisher=Pavel Mareš',
                  'AppCopyright=© 2026 Created by Pavel Mareš',
                  'DefaultDirName={autopf}' + BS + app_name,
                  'DisableProgramGroupPage=yes',
                  'PrivilegesRequired=lowest',
                  'PrivilegesRequiredOverridesAllowed=dialog',
                  'ArchitecturesAllowed=' + arch_id,
                  'ArchitecturesInstallIn64BitMode=' + arch_id,
                  'SetupIconFile=' + abs_ico,
                  'UninstallDisplayIcon={app}' + BS + app_name + '.exe',
                  'UninstallDisplayName=' + app_name,
                  'Compression=lzma2/fast',
                  'SolidCompression=yes',
                  'WizardStyle=modern',
                  'CloseApplications=yes',
                  'ChangesAssociations=' + ('yes' if assoc_ext else 'no'),
                  'OutputDir=' + abs_out_dir,
                  'OutputBaseFilename=' + setup_base,
                  '',
                  '[Languages]',
                  lang_line,
                  '',
                  '[Tasks]',
                  'Name: ' + DQ + 'desktopicon' + DQ + '; Description: ' + DQ + 'Vytvořit zástupce na &Ploše' + DQ + '; GroupDescription: ' + DQ + 'Zástupci aplikace:' + DQ
              ]
              if assoc_ext:
                  ext_up = assoc_ext.upper()
                  iss.append('Name: ' + DQ + 'fileassoc' + DQ + '; Description: ' + DQ + f'Zaregistrovat {app_name} pro otevírání souborů {ext_up} ve Windows 11' + DQ + '; GroupDescription: ' + DQ + 'Asociace souborů:' + DQ)

              iss.extend([
                  '',
                  '[Files]',
                  'Source: ' + DQ + abs_onedir + BS + '*' + DQ + '; DestDir: ' + DQ + '{app}' + DQ + '; Flags: ignoreversion recursesubdirs createallsubdirs',
                  '',
                  '[Icons]',
                  'Name: ' + DQ + '{autoprograms}' + BS + app_name + DQ + '; Filename: ' + DQ + '{app}' + BS + app_name + '.exe' + DQ + '; WorkingDir: ' + DQ + '{app}' + DQ,
                  'Name: ' + DQ + '{autodesktop}' + BS + app_name + DQ + '; Filename: ' + DQ + '{app}' + BS + app_name + '.exe' + DQ + '; WorkingDir: ' + DQ + '{app}' + DQ + '; Tasks: desktopicon'
              ])

              if assoc_ext:
                  prog_id = app_name + assoc_ext
                  cmd_val = DQ * 3 + '{app}' + BS + app_name + '.exe' + DQ * 2 + ' ' + DQ * 2 + '%1' + DQ * 3
                  iss.extend([
                      '',
                      '[Registry]',
                      'Root: HKA; Subkey: ' + DQ + 'Software' + BS + 'Classes' + BS + assoc_ext + BS + 'OpenWithProgids' + DQ + '; ValueType: string; ValueName: ' + DQ + prog_id + DQ + '; ValueData: ' + DQ + DQ + '; Flags: uninsdeletevalue; Tasks: fileassoc',
                      'Root: HKA; Subkey: ' + DQ + 'Software' + BS + 'Classes' + BS + prog_id + DQ + '; ValueType: string; ValueName: ' + DQ + DQ + '; ValueData: ' + DQ + f'Soubor {assoc_ext.upper()} ({app_name})' + DQ + '; Flags: uninsdeletekey; Tasks: fileassoc',
                      'Root: HKA; Subkey: ' + DQ + 'Software' + BS + 'Classes' + BS + prog_id + BS + 'DefaultIcon' + DQ + '; ValueType: string; ValueName: ' + DQ + DQ + '; ValueData: ' + DQ + '{app}' + BS + app_name + '.exe,0' + DQ + '; Tasks: fileassoc',
                      'Root: HKA; Subkey: ' + DQ + 'Software' + BS + 'Classes' + BS + prog_id + BS + 'shell' + BS + 'open' + BS + 'command' + DQ + '; ValueType: string; ValueName: ' + DQ + DQ + '; ValueData: ' + cmd_val + '; Tasks: fileassoc',
                      'Root: HKA; Subkey: ' + DQ + 'Software' + BS + 'Classes' + BS + 'Applications' + BS + app_name + '.exe' + BS + 'SupportedTypes' + DQ + '; ValueType: string; ValueName: ' + DQ + assoc_ext + DQ + '; ValueData: ' + DQ + DQ + '; Flags: uninsdeletekey; Tasks: fileassoc'
                  ])

              iss.extend([
                  '',
                  '[Run]',
                  'Filename: ' + DQ + '{app}' + BS + app_name + '.exe' + DQ + '; Description: ' + DQ + f'Spustit {app_name}' + DQ + '; Flags: nowait postinstall skipifsilent',
                  ''
              ])

              iss_path = os.path.abspath('build_win/setup.iss')
              with open(iss_path, 'w', encoding='utf-8-sig') as f:
                  f.write('\r\n'.join(iss))
              print('Kompiluji nativni Windows 11 instalator pres Inno Setup...')
              subprocess.run([iscc_bin, iss_path], check=True)
              final_name = f'{setup_base}.exe'
              final_exe = os.path.join(abs_out_dir, final_name)
          else:
              built_exe = os.path.join('dist', f'{app_name}.exe')
              final_name = f'{app_name}-Portable-{app_ver}.{build_num}.exe'
              final_exe = os.path.join('out_exe', final_name)
              shutil.move(built_exe, final_exe)

          print('Hotovo EXE:', final_exe, os.path.getsize(final_exe), 'B')

          gh_tok = os.environ.get('GH_TOKEN', '').strip()
          repo_full = os.environ.get('REPO_FULL', '').strip()
          if gh_tok and repo_full:
              def gh_api(url, method='GET', data=None, ctype='application/json'):
                  h = {'Authorization': f'Bearer {gh_tok}', 'Accept': 'application/vnd.github+json', 'User-Agent': 'Stavitel-Win-Builder-V2'}
                  if data is not None: h['Content-Type'] = ctype
                  req = urllib.request.Request(url, data=data, headers=h, method=method)
                  with urllib.request.urlopen(req, timeout=300) as r:
                      raw = r.read()
                      return json.loads(raw.decode('utf-8')) if raw else {}
              tag = 'exe-latest'
              meta = json.dumps({'exe_name': final_name, 'pkg_type': pkg_type, 'version': f'{app_ver}.{build_num}'})
              rel = None
              try: rel = gh_api(f'https://api.github.com/repos/{repo_full}/releases/tags/{tag}')
              except Exception: rel = None
              rel_title = f'Poslední Windows Setup ({final_name})' if is_installer else f'Poslední přenosné EXE ({final_name})'
              if rel and rel.get('id'):
                  rid = rel['id']
                  for a in rel.get('assets', []):
                      gh_api(f'https://api.github.com/repos/{repo_full}/releases/assets/{a["id"]}', method='DELETE')
                  rel = gh_api(f'https://api.github.com/repos/{repo_full}/releases/{rid}', method='PATCH',
                               data=json.dumps({'name': rel_title, 'body': meta, 'prerelease': True}).encode('utf-8'))
              else:
                  rel = gh_api(f'https://api.github.com/repos/{repo_full}/releases', method='POST',
                               data=json.dumps({'tag_name': tag, 'name': rel_title, 'body': meta, 'prerelease': True}).encode('utf-8'))
              up_url = f'https://uploads.github.com/repos/{repo_full}/releases/{rel["id"]}/assets?name={urllib.parse.quote(final_name)}'
              with open(final_exe, 'rb') as ef:
                  up = gh_api(up_url, method='POST', data=ef.read(), ctype='application/vnd.microsoft.portable-executable')
              print('Publikovano v Release exe-latest:', up.get('browser_download_url', ''))
          '@ | Set-Content -Path 'build_win/_run_win_build.py' -Encoding UTF8
          python build_win/_run_win_build.py
      - name: Upload Windows .EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Windows-EXE
          path: out_exe/*.exe
